<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - WhatFormat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="h-screen flex flex-col justify-between p-6 md:p-10 overflow-hidden bg-[#080808]">

    <!-- Custom Cursor -->
    <div id="cursor"></div>

    <!-- Noise Texture -->
    <div class="grain-overlay"></div>

    <!-- Nav -->
    <nav class="flex justify-between items-center z-20 text-white">
        <a href="index.html" class="hover-trigger font-display font-bold text-2xl tracking-tighter">
            WF<span class="text-gray-500">.</span>
        </a>
        
        <div class="flex gap-8 text-xs uppercase tracking-widest font-medium">
            <a href="index.html" class="hover-trigger hover:text-gray-400 transition-colors" data-i18n="nav.home">Home</a>
            <a href="convert.html" class="hover-trigger hover:text-gray-400 transition-colors" data-i18n="nav.format">Format</a>
            <a href="about.html" class="hover-trigger text-gray-400" data-i18n="nav.about">About</a>
        </div>

        <button id="lang-toggle" class="hover-trigger font-mono text-[10px] border border-white/20 px-3 py-1.5 rounded-full hover:bg-white hover:text-black transition-all">中文</button>
    </nav>

    <!-- Main Content -->
    <main class="z-20 flex-1 flex items-center justify-center relative">
        <!-- Abstract Bg Elements -->
        <div class="absolute left-1/4 top-1/4 w-64 h-64 border border-white/5 rounded-full animate-pulse"></div>
        <div class="absolute right-1/3 bottom-1/3 w-48 h-48 border border-white/5" style="border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;"></div>

        <div class="text-center max-w-2xl mx-auto space-y-10 px-4">
            <h1 class="text-4xl md:text-6xl font-display font-bold uppercase tracking-tighter text-white">
                <span data-i18n="about.title1">Our</span><br><span class="text-gray-600" data-i18n="about.title2">Mission</span>
            </h1>
            
            <div class="bg-[#0a0a0a]/80 backdrop-blur-md border border-white/10 p-8 md:p-10 rounded-lg relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
                
                <p class="text-lg md:text-xl font-light text-gray-300 leading-relaxed" id="about-quote" data-i18n-html="about.quote">
                    "We believe that the <span class="text-white font-medium">form of information</span> is as important as the information itself. We are redefining document intelligence through <span class="text-white font-medium">pure aesthetics</span> and code."
                </p>
            </div>

            <div class="flex justify-center gap-12 md:gap-16 text-[10px] font-mono uppercase tracking-widest text-gray-500">
                <div class="text-center">
                    <div class="text-2xl text-white font-display mb-1">99%</div>
                    <div data-i18n="about.stat1">Accuracy</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl text-white font-display mb-1">0.3s</div>
                    <div data-i18n="about.stat2">Processing</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl text-white font-display mb-1">24/7</div>
                    <div data-i18n="about.stat3">Uptime</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="z-20 flex justify-between items-end text-[10px] font-mono text-gray-600 uppercase">
        <span data-i18n="about.footer1">Est. 2026</span>
        <span class="text-white" data-i18n="about.footer2">Version 2.0</span>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        const cursor = document.getElementById('cursor');
        const hoverTriggers = document.querySelectorAll('.hover-trigger');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        hoverTriggers.forEach(el => {
            el.addEventListener('mouseenter', () => cursor.classList.add('hovered'));
            el.addEventListener('mouseleave', () => cursor.classList.remove('hovered'));
        });
    </script>
</body>
</html>
